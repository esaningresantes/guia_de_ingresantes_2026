<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía del Ingresante ESAN 2026-2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #e2e8f0; font-family: 'Montserrat', sans-serif; }

        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.3); }

        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }

<body class="h-screen flex flex-col md:flex-row overflow-hidden" id="app">

<!-- PANTALLA INICIAL -->
<div id="overlay" class="fixed inset-0 bg-black z-[9999] flex items-center justify-center">
    <div class="glass p-8 rounded-xl w-full max-w-md text-center space-y-4">

        <h2 class="text-2xl text-white font-serif">Acceso a la guía</h2>

        <input 
            type="text" 
            id="dni" 
            placeholder="Ingresa tu DNI"
            class="w-full p-3 rounded bg-slate-900 text-white border border-slate-700 focus:outline-none"
        >

        <label class="flex items-center gap-2 text-sm text-slate-300 justify-center">
            <input type="checkbox" id="check">
            Me comprometo a leer y seguir la guía
        </label>

        <button onclick="ingresar()" 
            class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded text-white font-semibold w-full">
            Ingresar
        </button>

        <p id="error" class="text-red-400 text-sm hidden"></p>

    </div>
</div>

                <p class="text-[10px] text-red-400 uppercase tracking-widest">Ingresantes 2026-2</p>

        </div>
        <div class="flex-1 overflow-y-auto py-2" id="menu-container"></div>
        <div class="p-4 text-center text-xs text-slate-500 bg-slate-950">

        </div>
    </aside>

    <!-- MAIN -->

        <div class="h-16 border-b border-slate-800 flex items-center px-6 gap-4 bg-slate-950/90 backdrop-blur z-10">
            <i data-lucide="search" class="text-slate-500"></i>

        // NAVEGACIÓN LATERAL
        function renderMenu() {
            const container = document.getElementById('menu-container');
            const keys = Object.keys(db).filter(k => k !== 'welcome');
            container.innerHTML = keys.map(key => `
                <button onclick="renderContent('${key}')" id="btn-${key}" class="w-full text-left px-6 py-3 text-slate-300 text-[13px] font-semibold tracking-wide hover:text-white hover:bg-slate-900 transition flex items-center gap-3">
                    <i data-lucide="${db[key].icon}" class="w-4 h-4"></i> ${db[key].title}
                </button>
            `).join('');
            lucide.createIcons();
        }

        // MOSTRAR CONTENIDO
        function renderContent(key) {
            const viewer = document.getElementById('viewer');
            viewer.innerHTML = db[key].html;

            document.querySelectorAll('#menu-container button').forEach(b => b.classList.remove('active-tab'));
            const btn = document.getElementById(`btn-${key}`);
            if (btn) btn.classList.add('active-tab');

            lucide.createIcons();
            viewer.scrollTop = 0;
        }

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search').addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    if (val.length < 3) return;

    const searchMap = [
      { target: 'I', keywords: ['matr', 'ingresant'] },
      { target: 'II', keywords: ['escala', 'crédit', 'pago', 'pension'] },
      { target: 'III', keywords: ['boleta', 'medios de pago', 'yape', 'bcp', 'bbva', 'visa'] },
      { target: 'IV', keywords: ['descuento', 'beneficio', 'herman', 'familia', 'pronto pago'] },
      { target: 'V', keywords: ['convalid', 'traslado', 'bachillerato'] },
      { target: 'VI', keywords: ['ciclo 0', 'ciclo cero', 'preform', 'pre-form', 'curso cero'] },
      { target: 'VII', keywords: ['nivelacion', 'nivelación', 'pnu', 'nivelacion universitaria'] },
      { target: 'VIII', keywords: ['suficiencia', 'examen', 'exámenes', 'examenes'] },
      { target: 'IX', keywords: ['extensión', 'extension', 'extended learning', 'curso extra'] },
      { target: 'X', keywords: ['inglés', 'ingles', 'idioma'] },
      { target: 'XI', keywords: ['reserva', 'renuncia', 'retiro'] },
      { target: 'XII', keywords: ['calendario', 'fechas', 'cronograma'] },
      { target: 'XIII', keywords: ['directorio', 'contacto', 'teléfono', 'telefono'] }
    ];

    for (const item of searchMap) {
      if (item.keywords.some(k => val.includes(k))) {
        renderContent(item.target);
        break;
      }
    }
  });
});

        window.onload = function () {
    const dniGuardado = localStorage.getItem("dni");

    if (dniGuardado) {
        entrarDirecto();
    }
};

function ingresar() {
    const dni = document.getElementById("dni").value.trim();
    const check = document.getElementById("check").checked;
    const error = document.getElementById("error");

    if (!/^\d{8}$/.test(dni)) {
        error.innerText = "Ingresa un DNI válido (8 dígitos)";
        error.classList.remove("hidden");
        return;
    }

    if (!check) {
        error.innerText = "Debes aceptar el compromiso";
        error.classList.remove("hidden");
        return;
    }

    localStorage.setItem("dni", dni);

    entrarDirecto();
}

function entrarDirecto() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("app").classList.remove("opacity-0");
}
